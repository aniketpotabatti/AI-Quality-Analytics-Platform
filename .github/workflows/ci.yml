name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: has
          POSTGRES_PASSWORD: has
          POSTGRES_DB: hallucination_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install evaluation-engine
        working-directory: packages/evaluation-engine
        run: uv sync --dev

      - name: Install API
        working-directory: apps/api
        run: uv sync --dev

      - name: Lint API
        working-directory: apps/api
        run: uv run ruff check .

      - name: Test evaluation-engine
        working-directory: packages/evaluation-engine
        run: uv run pytest

      - name: Test API
        working-directory: apps/api
        env:
          APP_SECRET_KEY: ci-test-secret-key-with-sufficient-length
          DATABASE_URL: postgresql+asyncpg://has:has@localhost:5432/hallucination_analytics_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-jwt-secret-key-with-sufficient-length
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Test web
        working-directory: apps/web
        run: npm run test

      - name: Build web
        working-directory: apps/web
        run: npm run build
