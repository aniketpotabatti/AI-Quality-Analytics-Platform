name: hallucination-analytics-studio

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: has_user
      POSTGRES_PASSWORD: has_password
      POSTGRES_DB: has_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U has_user -d has_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://has_user:has_password@db:5432/has_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-local-dev-key-change-in-prod
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn has_api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/evaluation-engine:/app/packages/evaluation-engine

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://has_user:has_password@db:5432/has_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: >
      arq has_api.workers.settings.WorkerSettings
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/evaluation-engine:/app/packages/evaluation-engine

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
